modLoader = "javafml"
loaderVersion = "[0,)"
license = "Apache-2.0"
issueTrackerURL = "https://github.com/ObliviousSpartan/SpartanShields/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "https://minecraft.curseforge.com/projects/spartan-shields"
logoFile = "logo.png"
authors = "ObliviousSpartan"
description = '''Spartan Shields adds a variety of new shields to Minecraft. Architectury API port (NeoForge target).'''

[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version}]"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "architectury"
type = "required"
versionRange = "[${architectury_api_version},)"
ordering = "AFTER"
side = "BOTH"
