plugins {
    id "com.gradleup.shadow"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    // Dev-only runtime mods: JEI + Hold My Items
    modLocalRuntime files(
            rootProject.file("tools/devmods/mezz_config-1.20.1-fabric-0.6.3.jar"),
            rootProject.file("tools/devmods/jei-1.20.1-fabric-15.62.0.217.jar"),
            rootProject.file("tools/devmods/hold-my-items-fabric-4.2.5H1.jar"))

    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // Architectury API
    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowBundle project(path: ":common", configuration: "transformProductionFabric")

    annotationProcessor "org.spongepowered:mixin:$rootProject.mixin_version:processor"
    compileOnly "org.spongepowered:mixin:$rootProject.mixin_version"
    compileOnly "org.jetbrains:annotations:24.1.0"
}

processResources {
    from project(":common").sourceSets.main.resources
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property "version", project.version
    inputs.property "minecraft_version", rootProject.minecraft_version
    inputs.property "loader_version", rootProject.fabric_loader_version

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": rootProject.minecraft_version,
                "loader_version": rootProject.fabric_loader_version
    }
}

loom {
    mixin {
        useLegacyMixinAp = false
    }
    runs {
        named("client") {
            client()
            ideConfigGenerated true
            runDir "run"
        }
        named("server") {
            server()
            ideConfigGenerated true
            runDir "run"
        }
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"
}

remapJar {
    inputFile.set shadowJar.archiveFile
}