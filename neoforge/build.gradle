plugins {
    id "com.gradleup.shadow"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    // Note: NeoForge is the fork-era loader for MC 1.20.4 (20.4.x); Architectury Loom reads
    // the NeoForge userdev artifact from the `neoForge` configuration it creates itself (the same
    // mechanism the :forge module uses with the `forge` configuration). The platform is selected
    // through the `loom.platform` property (see neoforge/gradle.properties).
    neoForge "net.neoforged:neoforge:$rootProject.neo_version"
    compileOnly "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Architectury API (NeoForge side of the 10.x line, verified on maven.architectury.dev)
    modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowBundle project(path: ":common", configuration: "transformProductionNeoForge")

    annotationProcessor "org.spongepowered:mixin:$rootProject.mixin_version:processor"
    compileOnly "org.spongepowered:mixin:$rootProject.mixin_version"
    compileOnly "org.jetbrains:annotations:24.1.0"

    // Optional integration: JEI (the NeoForge flavour of the 17.x line exists for MC 1.20.4)
    compileOnly "mezz.jei:jei-${project.findProperty('jei_mc_version') ?: rootProject.minecraft_version}-neoforge-api:$rootProject.jei_version"
}

processResources {
    from project(":common").sourceSets.main.resources
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def replaceProperties = [
            mod_id           : rootProject.mod_id,
            mod_name         : rootProject.mod_name,
            mod_version      : rootProject.mod_version,
            minecraft_version: rootProject.minecraft_version,
            neo_version      : rootProject.neo_version,
            architectury_api_version: rootProject.architectury_api_version,
    ]
    inputs.properties replaceProperties

    filesMatching("META-INF/mods.toml") {
        expand replaceProperties
    }
}

loom {
    mixin {
        useLegacyMixinAp = false
    }
    runs {
        named("client") {
            client()
            ideConfigGenerated true
            runDir "run"
        }
        named("server") {
            server()
            ideConfigGenerated true
            runDir "run"
        }

        // Diagnostic run: boots straight into the test world so the client-side tag sync has
        // happened before ClientHelper's diagnostics fire.
        clientDiag {
            client()
            programArgs "--quickPlaySingleplayer", "New World"
            ideConfigGenerated false
            runDir "run"
        }
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
