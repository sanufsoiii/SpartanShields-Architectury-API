modLoader="javafml"
loaderVersion="[46,)"
license="Apache License v2.0"
issueTrackerURL="https://github.com/ObliviousSpartan/SpartanShields/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://minecraft.curseforge.com/projects/spartan-shields"
logoFile="logo.png"
authors="ObliviousSpartan"
description='''
Spartan Shields adds a variety of new shields to Minecraft. Architectury API port (Forge target).
'''

[[mixins]]
config="spartanshields.mixins.json"

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="[46,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="[${minecraft_version}]"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="architectury"
mandatory=true
versionRange="[${architectury_api_version},)"
ordering="AFTER"
side="BOTH"
