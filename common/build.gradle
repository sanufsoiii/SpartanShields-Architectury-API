architectury {
    common("forge", "fabric")
}

dependencies {
    compileOnly "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"


    // Architectury API (loader-agnostic core of Architectury API 9.x)
    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version"

    // Mixin: shared mixin classes live in :common
    annotationProcessor "org.spongepowered:mixin:$rootProject.mixin_version:processor"
    compileOnly "org.spongepowered:mixin:$rootProject.mixin_version"

    // Annotations
    compileOnly "org.jetbrains:annotations:24.1.0"

    // Optional integration: JEI. The Fabric artifact contains the same `mezz.jei.api`
    // surface, so the no-op plugin class compiles here and never loads when JEI is
    // absent. Botania needs no dependency at all - see compat/BotaniaCompat.
    compileOnly "mezz.jei:jei-1.20.1-forge:$rootProject.jei_version"
}