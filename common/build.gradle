architectury {
    common("neoforge", "fabric")
}

dependencies {
    compileOnly "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Architectury API
    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version"

    // Mixin: shared mixin classes live in :common
    annotationProcessor "org.spongepowered:mixin:$rootProject.mixin_version:processor"
    compileOnly "org.spongepowered:mixin:$rootProject.mixin_version"

    // Annotations
    compileOnly "org.jetbrains:annotations:24.1.0"

    // Optional integration: JEI
    compileOnly "mezz.jei:jei-${project.findProperty('jei_mc_version') ?: rootProject.minecraft_version}-common-api:$rootProject.jei_version"

    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}